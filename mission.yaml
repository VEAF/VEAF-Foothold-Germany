config_override:
  target: "Foothold Config.lua"
  values:
    Era: Modern              # Modern | Coldwar | Gulfwar (Iraq) | Vietnam
    FootholdLocale: FR       # on-screen Foothold messages in French
    CapDifficulty: medium    # RED CAP amount
    StartNormal: true        # standard start (Caucasus/PG/Syria/Afghanistan only)
    AutoRestart: false       # let players choose to restart from the radio menu

